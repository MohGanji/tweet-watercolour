<!doctype html>
<meta charset="utf-8">
<title>watercolour fixture</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.45 -apple-system, system-ui, sans-serif; margin: 0; background: #fff; color: #0f1419; }
  #feed { max-width: 600px; margin: 0 auto; }
  article { border-bottom: 1px solid #eff3f4; padding: 14px 16px; }
  .row { display: flex; gap: 8px; align-items: baseline; }
  .name { font-weight: 700; }
  .handle, .dot { color: #536471; }
  .txt { margin-top: 3px; white-space: pre-wrap; }
  #hud { position: fixed; top: 8px; right: 8px; background: #111; color: #0f0; font: 11px ui-monospace, monospace; padding: 6px 8px; border-radius: 6px; z-index: 99; white-space: pre; }
  button { position: fixed; top: 8px; left: 8px; z-index: 99; padding: 6px 10px; }
</style>
<div id="hud">loading…</div>
<button id="dark">toggle dark</button>
<div id="feed"></div>
<script>
window.__batches = [];
// Real distributions measured from jev on these exact tweets.
const MEASURED = {
  0: { choice: 'red',        layers: [['red', 1.00]] },
  1: { choice: 'dark blue',  layers: [['dark blue', 1.00]] },
  2: { choice: 'hot pink',   layers: [['hot pink', 0.71], ['yellow', 0.27]] },
  3: { choice: 'teal',       layers: [['teal', 0.71], ['light blue', 0.29]] },
  4: { choice: 'gray',       layers: [['gray', 1.00]] },
  5: { choice: 'dark blue',  layers: [['dark blue', 0.52], ['indigo', 0.46]] },
  6: { choice: 'yellow',     layers: [['yellow', 0.66], ['orange', 0.20], ['hot pink', 0.08]] },
  7: { choice: 'teal',       layers: [['teal', 0.65], ['light blue', 0.26], ['green', 0.04]] },
  8: { choice: 'indigo',     layers: [['indigo', 0.37], ['light pink', 0.29], ['brown', 0.18], ['orange', 0.11]] },
};
const PALETTE = { red:'#dd1706', orange:'#f88100', brown:'#a25900', yellow:'#fad200', green:'#00a02a',
  teal:'#00c7a6', 'dark blue':'#004e60', 'light blue':'#0081f8', indigo:'#3444da', purple:'#841bb9',
  'light pink':'#fcbaff', 'hot pink':'#ff8cd0', gray:'#9e9e9e' };

const store = { enabled: true, intensity: 1, debug: true, apiKey: 'fixture' };
const listeners = [];
window.chrome = {
  storage: {
    local: {
      get: (d) => Promise.resolve(typeof d === 'string' ? { [d]: store[d] } : Object.fromEntries(
        Object.entries(d).map(([k, v]) => [k, store[k] !== undefined ? store[k] : v]))),
      set: (o) => { const ch = {}; for (const [k, v] of Object.entries(o)) { ch[k] = { oldValue: store[k], newValue: v }; store[k] = v; } listeners.forEach((f) => f(ch)); return Promise.resolve(); },
    },
    onChanged: { addListener: (fn) => listeners.push(fn) },
  },
  runtime: {
    sendMessage: async ({ items }) => {
      window.__batches.push(items.map((i) => i.id));
      await new Promise((r) => setTimeout(r, 620)); // measured latency for a batch of 9
      const washes = {};
      for (const it of items) {
        const m = MEASURED[Number(it.id) - 1000];  // ids are 1000..1008, index directly
        washes[it.id] = { choice: m.choice, layers: m.layers.map(([name, weight]) => ({ name, hex: PALETTE[name], weight })) };
      }
      return { ok: true, washes, cost: 0.000153 };
    },
  },
};

const TWEETS = [
  ['stormseeker', "absolutely furious. they cancelled the flight AGAIN with no explanation and now i'm stuck here for 9 hours"],
  ['quietfern',   "my grandmother passed this morning. she taught me to make bread and i never wrote the recipe down."],
  ['maeve_r',     "SHE SAID YES!!! 💍 still shaking, best day of my entire life"],
  ['lakeside',    "morning fog on the water, nobody else at the lake. just me and a thermos of tea. perfect."],
  ['ops_notices', "reminder that the quarterly compliance training is due friday. takes about 20 minutes."],
  ['nightowl',    "can't sleep. keep replaying that conversation. why did i say that. why did i say that."],
  ['catlogic',    "my cat has decided the printer is her enemy and attacks it every time it makes a noise 😹"],
  ['perf_eng',    "shipped the new caching layer today. p99 latency down from 400ms to 38ms."],
  ['boxofphotos', "found a shoebox of disposable camera photos from 2003. everyone looks so young and the colours are all wrong."],
];

const feed = document.getElementById('feed');
TWEETS.forEach(([handle, text], i) => {
  const a = document.createElement('article');
  a.setAttribute('data-testid', 'tweet');
  a.innerHTML = `<div><div class="row"><span class="name">${handle}</span>
      <span class="handle">@${handle}</span><span class="dot">· 2h</span></div>
      <a href="/${handle}/status/${1000 + i}" style="display:none">link</a>
      <div class="txt" data-testid="tweetText"></div></div>`;
  a.querySelector('.txt').textContent = text;
  feed.appendChild(a);
});

document.getElementById('dark').onclick = () => {
  const dark = document.body.style.background !== 'rgb(0, 0, 0)';
  document.body.style.background = dark ? '#000' : '#fff';
  document.body.style.color = dark ? '#e7e9ea' : '#0f1419';
};
setInterval(() => {
  document.getElementById('hud').textContent =
    `requests: ${window.__batches.length}\npainted:  ${document.querySelectorAll('[data-jev-hue]').length}\nrules:    ${(document.getElementById('jev-watercolour')?.textContent.match(/article\[/g) || []).length}`;
}, 200);
</script>
